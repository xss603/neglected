.trivy_s3_upload: &trivy_s3_upload
  stage: container-scan
  image:
    name: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: [""]
  variables:
    MC_HOST_trivy: "http://${TRIVY_S3_ACCESS_KEY}:${TRIVY_S3_SECRET_KEY}@minio.minio.svc.cluster.local:9000"

upload-trivy-report:backend:
  <<: *trivy_s3_upload
  needs: ["trivy-scan:backend"]
  script:
    - mc cp trivy-backend-report.json
        "trivy/trivy-reports/ci-scans/${CI_PROJECT_PATH}/backend/${CI_COMMIT_SHORT_SHA}.json"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: ["$BACKEND_DIR/**/*"]
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

upload-trivy-report:frontend:
  <<: *trivy_s3_upload
  needs: ["trivy-scan:frontend"]
  script:
    - mc cp trivy-frontend-report.json
        "trivy/trivy-reports/ci-scans/${CI_PROJECT_PATH}/frontend/${CI_COMMIT_SHORT_SHA}.json"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: ["$FRONTEND_DIR/**/*"]
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
