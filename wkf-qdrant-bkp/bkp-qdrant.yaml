# Example: an Argo WorkflowTemplate passed through a Helm chart's
# `extraObjects:` convention (a list of raw manifests, each rendered
# through Helm's own `tpl` function - the pattern used by many community
# charts for arbitrary passthrough resources).
#
# Every literal `{{ }}` inside the manifest below - both Argo's own
# `{{workflow.parameters.*}}` substitutions and the Vault Agent
# Injector's `{{- with secret ... -}}` templates - has to survive that
# `tpl` pass unevaluated. Helm sees `{{ }}` as its OWN template syntax by
# default, so each occurrence is wrapped in a Go template raw-string
# literal: `{{` + backtick + literal text + backtick + `}}`. Backticks
# specifically (not a quoted string) because the Vault template text
# itself contains double quotes, which would otherwise need escaping on
# top of escaping.
#
# Verified: rendered through a minimal chart implementing the exact
# `{{- range .Values.extraObjects }}{{ tpl (toYaml .) $ }}{{- end }}`
# passthrough pattern, output parsed back and checked - every escaped
# block came out as literal, unevaluated syntax; none of it was
# evaluated or mangled by Helm's own template pass.
#
# CAVEAT: this specific WorkflowTemplate was originally written for the
# bjw-s-labs/app-template chart, which uses a DICT keyed by identifier
# (`rawResources:`) for this purpose, not a LIST (`extraObjects:`).
# app-template has no `extraObjects` key at all (confirmed against its
# values.schema.json) - this file demonstrates the escaping technique
# for charts that DO use the `extraObjects:` list convention instead.
# Adjust the top-level key to whatever your actual chart expects.
#
# CAPACITY: sized for archives up to ~10GB, not a tiny test file. The
# `work` emptyDir holds the compressed .tar.gz AND its extracted
# contents at the same time until the extraction step deletes the
# compressed copy, so it needs real headroom over the archive's own
# size, and the extraction container needs real CPU - tar/gzip stream
# rather than buffer, so decompressing a 10GB archive is CPU-bound, not
# memory-bound; at the original 200m CPU limit that took 10+ minutes of
# raw throughput alone, so this now requests a full core.
extraObjects:
  - apiVersion: argoproj.io/v1alpha1
    kind: WorkflowTemplate
    metadata:
      name: restore-qdrant-snapshots
      namespace: argo-workflows
    spec:
      # Runs as the qdrant-restore ServiceAccount - a dedicated identity,
      # separate from whatever ServiceAccount takes backups, since
      # restore overwrites existing collection data and a backup-only
      # identity should not also be able to trigger that.
      serviceAccountName: qdrant-restore
      entrypoint: restore-archive
      arguments:
        parameters:
          - name: archive-key
            value: archives/full-backup.tar.gz
          # Empty = restore into the ORIGINAL collection name, i.e. a
          # real overwrite-in-place restore. Set this explicitly for any
          # dry run or test restore, e.g. "-test", so it lands in
          # "<collection>-test" instead of overwriting the real one.
          - name: restore-suffix
            value: ""
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        # 25Gi is 2.5x a 10GB source archive - covers the compressed
        # copy and its extracted contents coexisting, with headroom for
        # snapshot data that doesn't compress much. Check your own
        # node's actual free disk before picking a number here (`df -h`)
        # rather than copying this value - it was sized against a node
        # with 237GB free on a 290GB disk.
        - name: work
          emptyDir:
            sizeLimit: 25Gi
      templates:
        - name: restore-archive
          metadata:
            annotations:
              vault.hashicorp.com/agent-inject: "true"
              vault.hashicorp.com/agent-pre-populate-only: "true"
              # REQUIRED, not optional: without this, Kubernetes runs
              # user-defined initContainers in declared order and the
              # Vault Agent Injector APPENDS its own init container
              # after them rather than before - the download
              # initContainer below would run before /vault/secrets/*
              # exists. Confirmed directly with a scratch probe Pod
              # before relying on it.
              vault.hashicorp.com/agent-init-first: "true"
              vault.hashicorp.com/role: qdrant-restore
              vault.hashicorp.com/agent-inject-secret-qdrant-api-key: secret/data/apps/qdrant/api-key
              vault.hashicorp.com/agent-inject-template-qdrant-api-key: |
                {{`{{- with secret "secret/data/apps/qdrant/api-key" -}}{{ .Data.data.API_KEY }}{{- end -}}`}}
              vault.hashicorp.com/agent-inject-secret-minio-access-key: secret/data/apps/minio/qdrant-backup-credentials
              vault.hashicorp.com/agent-inject-template-minio-access-key: |
                {{`{{- with secret "secret/data/apps/minio/qdrant-backup-credentials" -}}{{ .Data.data.QDRANT_BACKUP_ACCESS_KEY }}{{- end -}}`}}
              vault.hashicorp.com/agent-inject-secret-minio-secret-key: secret/data/apps/minio/qdrant-backup-credentials
              vault.hashicorp.com/agent-inject-template-minio-secret-key: |
                {{`{{- with secret "secret/data/apps/minio/qdrant-backup-credentials" -}}{{ .Data.data.QDRANT_BACKUP_SECRET_KEY }}{{- end -}}`}}
          # ---- stage 1: download the archive from MinIO ----
          initContainers:
            - name: download
              image: minio/mc@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
              command: ["sh", "-c"]
              env: [{name: HOME, value: /tmp}]
              args:
                - |
                  set -eu
                  AK="$(cat /vault/secrets/minio-access-key)"
                  SK="$(cat /vault/secrets/minio-secret-key)"
                  ARCHIVE="{{`{{workflow.parameters.archive-key}}`}}"
                  mc alias set b "http://minio.minio.svc.cluster.local:9000" "$AK" "$SK"
                  echo "downloading qdrant-backups/$ARCHIVE"
                  mc cp "b/qdrant-backups/$ARCHIVE" /work/archive.tar.gz
                  ls -la /work/archive.tar.gz
              volumeMounts: [{name: tmp, mountPath: /tmp}, {name: work, mountPath: /work}]
              securityContext: &restoreSecurity
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                privileged: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
                seccompProfile: {type: RuntimeDefault}
              # mc streams the download rather than buffering it, so
              # memory stays low regardless of archive size - this is
              # margin, not a real requirement.
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 500m, memory: 128Mi}
          # ---- stage 2: extract, then restore every *.snapshot found,
          # into <original-collection-name><restore-suffix> ----
          container:
            image: curlimages/curl@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
            command: ["sh", "-c"]
            args:
              - |
                set -eu
                KEY="$(cat /vault/secrets/qdrant-api-key)"
                HOST="qdrant.qdrant.svc.cluster.local"
                SUFFIX="{{`{{workflow.parameters.restore-suffix}}`}}"
                mkdir -p /work/extracted
                echo "extracting archive"
                tar -xzvf /work/archive.tar.gz -C /work/extracted
                # Frees the compressed copy's space (up to ~10GB) before
                # the restore loop below starts reading the extracted
                # files - cuts /work's peak usage roughly in half rather
                # than leaving both copies around for the rest of the
                # step.
                rm -f /work/archive.tar.gz
                COUNT=0
                for f in $(find /work/extracted -name '*.snapshot'); do
                  COUNT=$((COUNT + 1))
                  SRC_COLL="$(basename "$(dirname "$f")")"
                  DEST_COLL="${SRC_COLL}${SUFFIX}"
                  echo "restoring $f -> collection $DEST_COLL"
                  curl -sf -X POST "http://$HOST:6333/collections/$DEST_COLL/snapshots/upload?wait=true" \
                    -H "api-key: $KEY" \
                    -F "snapshot=@$f"
                  echo
                done
                if [ "$COUNT" -eq 0 ]; then
                  echo "no .snapshot files found in the archive" >&2
                  exit 1
                fi
                echo "restored $COUNT collection(s)"
            volumeMounts: [{name: work, mountPath: /work}]
            securityContext: *restoreSecurity
            # CPU-bound, not memory-bound: tar/gzip decompress in a
            # stream rather than buffering the archive, so memory stays
            # modest regardless of size, but decompressing a 10GB
            # archive at 200m CPU would take 10+ minutes on throughput
            # alone. A full core keeps that to roughly a minute or two.
            resources:
              requests: {cpu: 250m, memory: 128Mi}
              limits: {cpu: "1", memory: 256Mi}
          retryStrategy:
            # Restore is not blindly safe to retry on every failure the
            # way backup is: OnError here would re-POST every already-
            # restored collection again if a LATER one in the loop
            # failed. limit stays low and the operator is expected to
            # look at which collection failed rather than assume a
            # clean re-run.
            limit: "1"
            retryPolicy: OnError
