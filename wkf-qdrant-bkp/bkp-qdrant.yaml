# vectordb-backup-wft.yaml
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: vectordb-backup
  namespace: data
spec:
  entrypoint: backup
  serviceAccountName: vectordb-backup-sa   # bound to Vault role
  arguments:
    parameters:
      - name: db-type
        value: "qdrant"
      - name: snapshot-name
        value: "backup-{{workflow.creationTimestamp}}"
  templates:
  - name: backup
    steps:
    - - name: snapshot
        template: create-snapshot

  - name: create-snapshot
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "vectordb-backup"
        vault.hashicorp.com/agent-inject-secret-qdrant: "secret/data/qdrant"
        vault.hashicorp.com/agent-inject-template-qdrant: |
          {{- with secret "secret/data/qdrant" -}}
          export QDRANT_API_KEY="{{ .Data.data.api_key }}"
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-minio: "secret/data/minio"
        vault.hashicorp.com/agent-inject-template-minio: |
          {{- with secret "secret/data/minio" -}}
          export AWS_ACCESS_KEY_ID="{{ .Data.data.access_key }}"
          export AWS_SECRET_ACCESS_KEY="{{ .Data.data.secret_key }}"
          {{- end }}
        vault.hashicorp.com/agent-pre-populate-only: "true"  # sidecar exits after populate
    script:
      image: curlimages/curl:8.9.1
      command: [sh]
      source: |
        set -e
        . /vault/secrets/qdrant
        . /vault/secrets/minio

        if [ "{{workflow.parameters.db-type}}" = "qdrant" ]; then
          curl -sX POST http://qdrant:6333/snapshots \
            -H "api-key: $QDRANT_API_KEY" -o /dev/null
          NAME=$(curl -s -H "api-key: $QDRANT_API_KEY" \
            http://qdrant:6333/snapshots | jq -r '.result[-1].name')
          curl -s -H "api-key: $QDRANT_API_KEY" \
            -o /tmp/snapshot.data \
            http://qdrant:6333/snapshots/$NAME
        else
          curl -sX POST http://milvus:9091/api/v1/backup -o /tmp/snapshot.data
        fi
    outputs:
      artifacts:
      - name: snapshot
        path: /tmp/snapshot.data
        archive: {none: {}}
        s3:
          key: "{{workflow.parameters.snapshot-name}}/snapshot.data"
