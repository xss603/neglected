# vectordb-backup-wft.yaml
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: vectordb-backup
  namespace: data
spec:
  entrypoint: backup
  serviceAccountName: vectordb-backup-sa
  arguments:
    parameters:
      - name: db-type
        value: "qdrant"
      - name: snapshot-name
        value: "backup-{{workflow.creationTimestamp}}"
  templates:
  - name: backup
    steps:
    - - name: snapshot
        template: create-snapshot

  - name: create-snapshot
    script:
      image: curlimages/curl:8.9.1
      command: [sh]
      env:
      - name: QDRANT_API_KEY
        valueFrom:
          secretKeyRef: {name: qdrant-auth, key: api-key}
      source: |
        set -e
        if [ "{{workflow.parameters.db-type}}" = "qdrant" ]; then
          curl -sX POST http://qdrant:6333/snapshots \
            -H "api-key: $QDRANT_API_KEY" -o /dev/null
          NAME=$(curl -s -H "api-key: $QDRANT_API_KEY" \
            http://qdrant:6333/snapshots | jq -r '.result[-1].name')
          curl -s -H "api-key: $QDRANT_API_KEY" \
            -o /tmp/snapshot.data \
            http://qdrant:6333/snapshots/$NAME
        else
          curl -sX POST http://milvus:9091/api/v1/backup -o /tmp/snapshot.data
        fi
    outputs:
      artifacts:
      - name: snapshot
        path: /tmp/snapshot.data
        archive: {none: {}}
        s3:
          key: "{{workflow.parameters.snapshot-name}}/snapshot.data"
          # bucket/endpoint/secret inherited from artifactRepositoryRef
          # or override here explicitly if no default configured:
          # endpoint: minio.minio.svc:9000
          # bucket: vectordb-backups
          # insecure: true
          # accessKeySecret: {name: minio-credentials, key: accesskey}
          # secretKeySecret: {name: minio-credentials, key: secretkey}
---
apiVersion: v1
kind: Secret
metadata: {name: qdrant-auth, namespace: data}
type: Opaque
stringData:
  api-key: CHANGE_ME   # inject via Vault/ExternalSecret
