apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-registry-access-secret
  annotations:
    policies.kyverno.io/title: Inject registry access secret
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Adds the registry-access imagePullSecret to Pods and Pod templates in
      namespaces labeled registry-access.xss603.io/inject=true.
spec:
  admission: true
  background: false
  failurePolicy: Ignore
  rules:
    - name: add-registry-access-secret
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchLabels:
                  registry-access.xss603.io/inject: "true"
      exclude:
        any:
          - resources:
              namespaces:
                - argocd
                - cert-manager
                - kube-node-lease
                - kube-public
                - kube-system
                - kyverno
      mutate:
        patchStrategicMerge:
          spec:
            imagePullSecrets:
              - name: registry-access
