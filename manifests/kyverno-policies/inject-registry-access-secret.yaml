apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-registry-access-secret
  annotations:
    policies.kyverno.io/title: Inject registry access secret
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Adds the registry-access imagePullSecret to Pods and Pod templates in
      namespaces labeled registry-access.xss603.io/inject=true.
spec:
  admission: true
  background: false
  rules:
    - name: add-registry-access-secret-to-pods
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchLabels:
                  registry-access.xss603.io/inject: "true"
      mutate:
        patchStrategicMerge:
          spec:
            imagePullSecrets:
              - name: registry-access
    - name: add-registry-access-secret-to-workload-templates
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
                - Job
              namespaceSelector:
                matchLabels:
                  registry-access.xss603.io/inject: "true"
      mutate:
        patchStrategicMerge:
          spec:
            template:
              spec:
                imagePullSecrets:
                  - name: registry-access
    - name: add-registry-access-secret-to-cronjobs
      match:
        any:
          - resources:
              kinds:
                - CronJob
              namespaceSelector:
                matchLabels:
                  registry-access.xss603.io/inject: "true"
      mutate:
        patchStrategicMerge:
          spec:
            jobTemplate:
              spec:
                template:
                  spec:
                    imagePullSecrets:
                      - name: registry-access
