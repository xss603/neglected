        \"f(this,'#lic tbody tr')\\\">\"\n             \"<div class='scroll'><table id='lic'><thead><tr><th>License</th><th>Family</th>\"\
        \n             \"<th class='num'>Unique packages</th><th class='num'>Occurrences</th></tr></thead><tbody>\"\
        )\n    for label, keys in sorted(lic_pkgs.items(), key=lambda kv: -len(kv[1])):\n        short\
        \ = label if len(label) <= 70 else label[:67] + \"...\"\n        o.append(\"<tr><td title='%s'>%s</td><td>%s</td><td\
        \ class='num'>%d</td><td class='num'>%d</td></tr>\"\n                 % (esc(label), esc(short),\
        \ badge(lic_fam[label], FAM_NAME[lic_fam[label]].split(\" (\")[0]), len(keys), lic_occ[label]))\n\
        \    o.append(\"</tbody></table></div><h2>Images &mdash; copyleft exposure first</h2>\"\n    \
        \         \"<div class='note'>Expand an image to see its LGPL/GPL/AGPL/MPL-family packages. Multiple\
