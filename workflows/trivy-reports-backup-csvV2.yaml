        \ images or packages...' oninput=\\\"f(this,'.img')\\\">\")\n    order = lambda r: tuple(-r[\"\
        counts\"][k] for k in (\"network\", \"strong\", \"weak\"))\n    for r in sorted(reports, key=order):\n\
        \        bs = \"\".join(badge(k, \"%d %s\" % (r[\"counts\"][k], FAM_NAME[k].split(\" (\")[0].split(\"\
        \ /\")[0]))\n                     for k, _, _ in FAMS if r[\"counts\"][k] and k not in (\"permissive\"\
        ,))\n        head = \"%s/%s &mdash; %s &nbsp; <small>%d pkgs</small> &nbsp; %s\" % (esc(r[\"ns\"\
        ]), esc(r[\"name\"]), esc(r[\"image\"]), r[\"total\"], bs)\n        if not r[\"flagged\"]:\n \
        \           o.append(\"<div class='row img'>%s</div>\" % head)\n            continue\n       \
        \ rows = \"\".join(\"<tr><td>%s</td><td>%s</td><td>%s</td><td>%s%s</td></tr>\"\n             \
        \          % (badge(f, FAM_NAME[f].split(\" (\")[0]), esc(nm), esc(ver), esc(lab if len(lab) <=\
        \ 70 else lab[:67] + \"...\"),\n                          \" <small style='color:#94a3b8'>&mdash;\
        \ least restrictive listed option: %s</small>\" % esc(FAM_NAME[lo].split(\" (\")[0]) if lo and\
        \ lo != f else \"\")\n                       for f, nm, ver, eco, lab, lo in sorted(r[\"flagged\"\
        ], key=lambda x: (-RANK[x[0]], x[1])))\n        o.append(\"<details class='img'><summary>%s</summary><table\
        \ class='inner'><thead><tr><th>Family</th><th>Package</th>\"\n                 \"<th>Version</th><th>License</th></tr></thead><tbody>%s</tbody></table></details>\"\
        \ % (head, rows))\n    o.append(\"<script>%s</script></body></html>\" % JS)\n    with open(out_path,\
        \ \"w\") as fh:\n        fh.write(\"\".join(o))\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv)\
        \ != 3:\n        sys.exit(\"usage: sbom_licenses.py <sbomreports.json> <licences.html>\")\n  \
        \  data = collect(sys.argv[1])\n    render(sys.argv[2], *data)\n    print(\"rendered %d SbomReports,\
        \ %d unique packages -> %s\" % (len(data[6]), len(data[0]), sys.argv[2]))\nPYEOF\npython3 /tmp/sbom_licenses.py\
        \ /tmp/sbomreports.json /tmp/licences.html\necho \"sbomreports.json: $(wc -c < /tmp/sbomreports.json)\
        \ bytes, licences.html: $(wc -c < /tmp/licences.html) bytes\"\n"
      volumeMounts:
      - name: tmp
        mountPath: /tmp
      securityContext: *id001
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 300m
          memory: 256Mi
    outputs:
      artifacts:
      - name: sbomreports
        path: /tmp/sbomreports.json
        archive:
          none: {}
        s3:
          endpoint: minio.minio.svc.cluster.local:9000
          bucket: trivy-reports
          insecure: true
          key: sbomreports/{{ "{{workflow.creationTimestamp.Y}}" }}-{{ "{{workflow.creationTimestamp.m}}"
            }}-{{ "{{workflow.creationTimestamp.d}}" }}/{{ "{{workflow.name}}" }}.json
          accessKeySecret:
            name: minio-trivy-backup-credentials
            key: TRIVY_BACKUP_ACCESS_KEY
          secretKeySecret:
            name: minio-trivy-backup-credentials
            key: TRIVY_BACKUP_SECRET_KEY
      - name: sbomreports-licences-html
        path: /tmp/licences.html
        archive:
          none: {}
        s3:
          endpoint: minio.minio.svc.cluster.local:9000
          bucket: trivy-reports
          insecure: true
          key: sbomreports/{{ "{{workflow.creationTimestamp.Y}}" }}-{{ "{{workflow.creationTimestamp.m}}"
            }}-{{ "{{workflow.creationTimestamp.d}}" }}/{{ "{{workflow.name}}" }}-licences.html
          accessKeySecret:
            name: minio-trivy-backup-credentials
            key: TRIVY_BACKUP_ACCESS_KEY
          secretKeySecret:
            name: minio-trivy-backup-credentials
            key: TRIVY_BACKUP_SECRET_KEY
    retryStrategy:
