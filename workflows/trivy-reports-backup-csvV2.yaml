apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: trivy-reports-backup
  namespace: argo-workflows
spec:
  serviceAccountName: argo-workflow
  entrypoint: backup-all
  activeDeadlineSeconds: 600
  podGC:
    strategy: OnPodCompletion
    deleteDelayDuration: 5m
  volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 512Mi
  templates:
  - name: backup-all
    dag:
      failFast: false
      tasks:
      - name: vulnerabilityreports
        template: backup
      - name: sbomreports
        template: sbom-report
  - name: backup
    initContainers:
    - name: export-json
      image: bitnami/kubectl@sha256:190ebe23a27084c9477b48cf9503472608197792456857ac8fdcf2eb877aa34e
      command:
      - /bin/sh
      - -c
      args:
      - "set -eu\necho \"exporting VulnerabilityReports...\"\nkubectl get vulnerabilityreports.aquasecurity.github.io\
        \ --all-namespaces -o json \\\n  | gzip -9 > /tmp/vulnerabilityreports.json.gz\necho \"report\
        \ count: $(kubectl get vulnerabilityreports.aquasecurity.github.io --all-namespaces --no-headers\
        \ | wc -l)\"\necho \"archive size: $(wc -c < /tmp/vulnerabilityreports.json.gz) bytes\"\n# Pod\
        \ metadata exists only so the CSV step below can join\n# each report to its scanned workload's\
        \ live annotations\n# (via ownerReferences - see render.py's pod_annotations_for).\n# Measured\
        \ directly on this cluster: 94 pods, ~1.8MB raw\n# JSON - trivially small, no need to project\
        \ fields here.\necho \"exporting Pods...\"\nkubectl get pods --all-namespaces -o json | gzip -9\
        \ > /tmp/pods.json.gz\necho \"pod count: $(kubectl get pods --all-namespaces --no-headers | wc\
        \ -l)\"\necho \"archive size: $(wc -c < /tmp/pods.json.gz) bytes\"\n"
      volumeMounts:
      - name: tmp
        mountPath: /tmp
      securityContext: &id001
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        allowPrivilegeEscalation: false
        privileged: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 300m
          memory: 320Mi
    container:
      image: mirror.gcr.io/library/python@sha256:4c47124a8391cb7a9f571164147d154777cf012a4ece5f86097130d7a4478111
      command:
      - /bin/sh
      - -c
      env:
      - name: PYTHONDONTWRITEBYTECODE
        value: '1'
      - name: HOME
        value: /tmp
      args:
      - "set -eu\necho \"rendering HTML report...\"\ngunzip -c /tmp/vulnerabilityreports.json.gz > /tmp/vulnerabilityreports.json\n\
        gunzip -c /tmp/pods.json.gz > /tmp/pods.json\ncat > /tmp/render.py <<'PYEOF'\nimport csv, json,\
        \ html, sys\nfrom collections import defaultdict\n\nSEV_ORDER = [\"CRITICAL\", \"HIGH\", \"MEDIUM\"\
        , \"LOW\", \"UNKNOWN\"]\nSEV_COLOR = {\n    \"CRITICAL\": \"#b91c1c\", \"HIGH\": \"#c2410c\",\
        \ \"MEDIUM\": \"#a16207\",\n    \"LOW\": \"#1d4ed8\", \"UNKNOWN\": \"#6b7280\",\n}\n\ndef esc(x):\n\
        \    return html.escape(str(x if x is not None else \"\"))\n\ndef build_pod_index(pods_data):\n\
        \    # Maps (owner_kind, namespace, owner_name) -> that pod's live\n    # annotations. trivy-operator's\
        \ \"resource.kind\"/\"resource.name\"\n    # labels on a VulnerabilityReport name the Pod's immediate\
        \ owner\n    # (e.g. ReplicaSet for a Deployment, Job for a CronJob) - which is\n    # exactly\
        \ what a Pod's own ownerReferences[0] points at. Confirmed\n    # directly against this cluster:\
        \ a ReplicaSet-owned pod's\n    # ownerReferences (kind=ReplicaSet, name=<rs-name>) matches its\n\
        \    # VulnerabilityReport's labels exactly, so no extra hop is needed.\n    # Bare Pod scans\
        \ are indexed by the Pod's own name under kind \"Pod\".\n    # Only the FIRST matching pod's annotations\
        \ are kept per key -\n    # replicas of the same owner share a template in practice, so this\n\
        \    # is a reasonable best-effort join, not a guaranteed-unique one.\n    index = {}\n    for\
        \ pod in pods_data.get(\"items\", []):\n        meta = pod.get(\"metadata\", {})\n        ns =\
        \ meta.get(\"namespace\", \"\")\n        name = meta.get(\"name\", \"\")\n        annotations\
        \ = meta.get(\"annotations\", {}) or {}\n        index.setdefault((\"Pod\", ns, name), annotations)\n\
        \        for owner in meta.get(\"ownerReferences\", []) or []:\n            key = (owner.get(\"\
        kind\", \"\"), ns, owner.get(\"name\", \"\"))\n            index.setdefault(key, annotations)\n\
        \    return index\n\ndef write_csv(out_path, items, pod_index):\n    fieldnames = [\n        \"\
        namespace\", \"resource_kind\", \"resource_name\", \"container\",\n        \"image_repository\"\
        , \"image_tag\", \"severity\", \"vulnerability_id\",\n        \"title\", \"installed_version\"\
        , \"fixed_version\", \"primary_link\",\n        \"pod_annotations_json\",\n    ]\n    with open(out_path,\
        \ \"w\", newline=\"\") as f:\n        writer = csv.DictWriter(f, fieldnames=fieldnames)\n    \
        \    writer.writeheader()\n        for item in items:\n            meta = item.get(\"metadata\"\
        , {})\n            labels = meta.get(\"labels\", {}) or {}\n            ns = labels.get(\"trivy-operator.resource.namespace\"\
        , meta.get(\"namespace\", \"\"))\n            kind = labels.get(\"trivy-operator.resource.kind\"\
        , \"\")\n            name = labels.get(\"trivy-operator.resource.name\", meta.get(\"name\", \"\
        \"))\n            container = labels.get(\"trivy-operator.container.name\", \"\")\n          \
        \  annotations = pod_annotations_for(pod_index, ns, kind, name)\n            report = item.get(\"\
        report\", {})\n            artifact = report.get(\"artifact\", {})\n            for v in report.get(\"\
        vulnerabilities\", []) or []:\n                writer.writerow({\n                    \"namespace\"\
        : ns, \"resource_kind\": kind, \"resource_name\": name,\n                    \"container\": container,\n\
        \                    \"image_repository\": artifact.get(\"repository\", \"\"),\n             \
        \       \"image_tag\": artifact.get(\"tag\", artifact.get(\"digest\", \"\")),\n              \
        \      \"severity\": v.get(\"severity\", \"UNKNOWN\"),\n                    \"vulnerability_id\"\
        : v.get(\"vulnerabilityID\", \"\"),\n                    \"title\": v.get(\"title\", \"\"),\n\
        \                    \"installed_version\": v.get(\"installedVersion\", \"\"),\n             \
        \       \"fixed_version\": v.get(\"fixedVersion\", \"\"),\n                    \"primary_link\"\
        : v.get(\"primaryLink\", \"\"),\n                    \"pod_annotations_json\": json.dumps(annotations,\
        \ sort_keys=True),\n                })\n\ndef pod_annotations_for(index, ns, kind, name):\n  \
        \  return index.get((kind, ns, name), {})\n\ndef counts_of(summary):\n    return {\n        \"\
        CRITICAL\": summary.get(\"criticalCount\", 0),\n        \"HIGH\": summary.get(\"highCount\", 0),\n\
        \        \"MEDIUM\": summary.get(\"mediumCount\", 0),\n        \"LOW\": summary.get(\"lowCount\"\
        , 0),\n        \"UNKNOWN\": summary.get(\"unknownCount\", 0),\n    }\n\ndef detail_table(vulns):\n\
        \    order = {s: i for i, s in enumerate(SEV_ORDER)}\n    rows = sorted(vulns, key=lambda v: order.get(v.get(\"\
        severity\", \"UNKNOWN\"), 99))\n    cells = []\n    for v in rows:\n        sev = v.get(\"severity\"\
        , \"UNKNOWN\")\n        vid = esc(v.get(\"vulnerabilityID\", \"\"))\n        link = v.get(\"primaryLink\"\
        , \"\")\n        vid_cell = \"<a href='%s' target='_blank'>%s</a>\" % (esc(link), vid) if link\
        \ else vid\n        cells.append(\n            \"<tr><td><span class='badge' style='background:%s'>%s</span></td>\"\
        \n            \"<td>%s</td><td>%s</td><td>%s</td><td>%s</td><td>%s</td></tr>\" % (\n         \
        \       SEV_COLOR.get(sev, \"#6b7280\"), esc(sev), vid_cell,\n                esc(v.get(\"resource\"\
        , \"\")), esc(v.get(\"installedVersion\", \"\")),\n                esc(v.get(\"fixedVersion\"\
        , \"-\")), esc(v.get(\"title\", \"\")),\n            )\n        )\n    return (\n        \"<table\
        \ class='detail-table'><thead><tr>\"\n        \"<th>Severity</th><th>CVE</th><th>Resource</th><th>Installed</th>\"\
        \n        \"<th>Fixed</th><th>Title</th></tr></thead><tbody>%s</tbody></table>\"\n    ) % \"\"\
        .join(cells)\n\ndef main(in_path, out_path, pods_path, csv_path):\n    with open(in_path) as f:\n\
        \        data = json.load(f)\n    items = data.get(\"items\", [])\n    with open(pods_path) as\
        \ f:\n        pods_data = json.load(f)\n    write_csv(csv_path, items, build_pod_index(pods_data))\n\
        \    rows = []\n    totals = defaultdict(int)\n    for item in items:\n        meta = item.get(\"\
        metadata\", {})\n        report = item.get(\"report\", {})\n        artifact = report.get(\"artifact\"\
        , {})\n        counts = counts_of(report.get(\"summary\", {}))\n        for sev, n in counts.items():\n\
        \            totals[sev] += n\n        rows.append({\n            \"ns\": meta.get(\"namespace\"\
        , \"\"), \"name\": meta.get(\"name\", \"\"),\n            \"repo\": artifact.get(\"repository\"\
        , \"\"),\n            \"tag\": artifact.get(\"tag\", artifact.get(\"digest\", \"\")),\n      \
        \      \"counts\": counts, \"vulns\": report.get(\"vulnerabilities\", []) or [],\n        })\n\
        \    rows.sort(key=lambda r: tuple(-r[\"counts\"][s] for s in SEV_ORDER))\n\n    summary_rows\
        \ = []\n    detail_sections = []\n    for r in rows:\n        image = \"%s:%s\" % (r[\"repo\"\
        ], r[\"tag\"]) if r[\"tag\"] else r[\"repo\"]\n        nums = \"\".join(\"<td class='num'>%d</td>\"\
        \ % r[\"counts\"][s] for s in SEV_ORDER)\n        total = sum(r[\"counts\"].values())\n      \
        \  summary_rows.append(\n            \"<tr><td>%s</td><td>%s</td><td>%s</td>%s<td class='num'><b>%d</b></td></tr>\"\
        \ % (\n                esc(r[\"ns\"]), esc(r[\"name\"]), esc(image), nums, total,\n          \
        \  )\n        )\n        if r[\"vulns\"]:\n            badges = \" \".join(\n                \"\
        <span class='badge' style='background:%s'>%d %s</span>\" % (\n                    SEV_COLOR[s],\
        \ r[\"counts\"][s], s.title())\n                for s in SEV_ORDER if r[\"counts\"][s]\n     \
        \       )\n            detail_sections.append(\n                \"<details><summary>%s/%s &mdash;\
        \ %s &nbsp;%s</summary>%s</details>\" % (\n                    esc(r[\"ns\"]), esc(r[\"name\"\
        ]), esc(image), badges, detail_table(r[\"vulns\"]),\n                )\n            )\n\n    head_cells\
        \ = \"\".join(\"<th class='num'>%s</th>\" % s.title() for s in SEV_ORDER)\n    grand_total = sum(totals.values())\n\
        \    style = (\n        \"body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#0f172a;\"\
        \n        \"color:#e2e8f0;margin:0;padding:24px}\"\n        \"h1{font-size:20px;margin-bottom:4px}.meta{color:#94a3b8;font-size:13px;margin-bottom:20px}\"\
        \n        \"table{border-collapse:collapse;width:100%;margin-bottom:28px;background:#1e293b}\"\
        \n        \"th,td{padding:6px 10px;border-bottom:1px solid #334155;text-align:left;font-size:13px}\"\
        \n        \"th{background:#0b1220;color:#94a3b8}tr:hover{background:#273449}\"\n        \".badge{display:inline-block;padding:2px\
        \ 8px;border-radius:10px;font-size:11px;\"\n        \"font-weight:600;color:#fff}.num{text-align:right;font-variant-numeric:tabular-nums}\"\
        \n        \"details{margin-bottom:10px;background:#1e293b;border-radius:6px}\"\n        \"summary{cursor:pointer;padding:10px\
        \ 14px;font-size:14px}\"\n        \"summary:hover{background:#273449}\"\n        \".detail-table{margin:0\
        \ 14px 14px 14px;width:calc(100% - 28px)}a{color:#60a5fa}\"\n    )\n    page = (\n        \"<!DOCTYPE\
        \ html><html><head><meta charset='utf-8'>\"\n        \"<title>Trivy VulnerabilityReports</title><style>%s</style></head><body>\"\
        \n        \"<h1>Trivy VulnerabilityReports export</h1>\"\n        \"<div class='meta'>%d reports\
        \ &middot; %d total findings</div>\"\n        \"<table><thead><tr><th>Namespace</th><th>Workload</th><th>Image</th>%s\"\
        \n        \"<th class='num'>Total</th></tr></thead><tbody>%s</tbody></table>%s\"\n        \"</body></html>\"\
        \n    ) % (style, len(items), grand_total, head_cells, \"\".join(summary_rows), \"\".join(detail_sections))\n\
        \    with open(out_path, \"w\") as f:\n        f.write(page)\n\nif __name__ == \"__main__\":\n\
        \    main(sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4])\nPYEOF\npython3 /tmp/render.py /tmp/vulnerabilityreports.json\
        \ /tmp/vulnerabilityreports.html /tmp/pods.json /tmp/vulnerabilityreports.csv\necho \"html size:\
        \ $(wc -c < /tmp/vulnerabilityreports.html) bytes\"\necho \"csv size: $(wc -c < /tmp/vulnerabilityreports.csv)\
        \ bytes, $(($(wc -l < /tmp/vulnerabilityreports.csv) - 1)) data rows\"\n"
      volumeMounts:
      - name: tmp
        mountPath: /tmp
      securityContext: *id001
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 300m
          memory: 320Mi
    outputs:
      artifacts:
      - name: vulnerabilityreports
        path: /tmp/vulnerabilityreports.json.gz
        archive:
          none: {}
        s3:
          endpoint: minio.minio.svc.cluster.local:9000
          bucket: trivy-reports
          insecure: true
          key: vulnerabilityreports/{{ "{{workflow.creationTimestamp.Y}}" }}-{{ "{{workflow.creationTimestamp.m}}"
            }}-{{ "{{workflow.creationTimestamp.d}}" }}/{{ "{{workflow.name}}" }}.json.gz
          accessKeySecret:
            name: minio-trivy-backup-credentials
            key: TRIVY_BACKUP_ACCESS_KEY
          secretKeySecret:
            name: minio-trivy-backup-credentials
            key: TRIVY_BACKUP_SECRET_KEY
      - name: vulnerabilityreports-html
        path: /tmp/vulnerabilityreports.html
        archive:
          none: {}
        s3:
          endpoint: minio.minio.svc.cluster.local:9000
          bucket: trivy-reports
          insecure: true
          key: vulnerabilityreports/{{ "{{workflow.creationTimestamp.Y}}" }}-{{ "{{workflow.creationTimestamp.m}}"
            }}-{{ "{{workflow.creationTimestamp.d}}" }}/{{ "{{workflow.name}}" }}.html
          accessKeySecret:
            name: minio-trivy-backup-credentials
            key: TRIVY_BACKUP_ACCESS_KEY
          secretKeySecret:
            name: minio-trivy-backup-credentials
            key: TRIVY_BACKUP_SECRET_KEY
      - name: vulnerabilityreports-csv
        path: /tmp/vulnerabilityreports.csv
        archive:
          none: {}
        s3:
          endpoint: minio.minio.svc.cluster.local:9000
          bucket: trivy-reports
          insecure: true
          key: vulnerabilityreports/{{ "{{workflow.creationTimestamp.Y}}" }}-{{ "{{workflow.creationTimestamp.m}}"
            }}-{{ "{{workflow.creationTimestamp.d}}" }}/{{ "{{workflow.name}}" }}.csv
          accessKeySecret:
            name: minio-trivy-backup-credentials
            key: TRIVY_BACKUP_ACCESS_KEY
          secretKeySecret:
            name: minio-trivy-backup-credentials
            key: TRIVY_BACKUP_SECRET_KEY
    retryStrategy:
      limit: '2'
      retryPolicy: OnError
  - name: sbom-report
    initContainers:
    - name: export-sbom
      image: mirror.gcr.io/library/python@sha256:4c47124a8391cb7a9f571164147d154777cf012a4ece5f86097130d7a4478111
      command:
      - /bin/sh
      - -c
      env:
      - name: PYTHONDONTWRITEBYTECODE
        value: '1'
      - name: HOME
        value: /tmp
      args:
      - "set -eu\ncat > /tmp/sbom_export.py <<'PYEOF'\nimport json, os, ssl, sys, urllib.parse, urllib.request\n\
        \nSA = \"/var/run/secrets/kubernetes.io/serviceaccount\"\nPAGE = 10\n\n\ndef api_get(path):\n\
        \    host = os.environ[\"KUBERNETES_SERVICE_HOST\"]\n    port = os.environ.get(\"KUBERNETES_SERVICE_PORT\"\
        , \"443\")\n    with open(SA + \"/token\") as f:\n        token = f.read().strip()\n    ctx =\
        \ ssl.create_default_context(cafile=SA + \"/ca.crt\")\n    req = urllib.request.Request(\"https://%s:%s%s\"\
        \ % (host, port, path),\n                                 headers={\"Authorization\": \"Bearer\
        \ \" + token})\n    with urllib.request.urlopen(req, context=ctx, timeout=60) as r:\n        return\
        \ json.load(r)\n\n\ndef main(out_path):\n    n, cont = 0, None\n    with open(out_path, \"w\"\
        ) as f:\n        f.write('{\"apiVersion\":\"v1\",\"kind\":\"List\",\"metadata\":{},\"items\":[\\\
        n')\n        while True:\n            q = \"limit=%d\" % PAGE + (\"&continue=\" + urllib.parse.quote(cont)\
        \ if cont else \"\")\n            page = api_get(\"/apis/aquasecurity.github.io/v1alpha1/sbomreports?\"\
        \ + q)\n            for it in page.get(\"items\", []):\n                f.write((\",\" if n else\
        \ \"\") + json.dumps(it, separators=(\",\", \":\")) + \"\\n\")\n                n += 1\n     \
        \       cont = page.get(\"metadata\", {}).get(\"continue\")\n            if not cont:\n      \
        \          break\n        f.write(\"]}\\n\")\n    if n == 0:\n        sys.exit(\"no SbomReports\
        \ found - refusing to publish an empty export\")\n    print(\"exported %d SbomReports to %s\"\
        \ % (n, out_path))\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 2:\n        sys.exit(\"\
        usage: sbom_export.py <sbomreports.json>\")\n    main(sys.argv[1])\nPYEOF\npython3 /tmp/sbom_export.py\
        \ /tmp/sbomreports.json\n"
      volumeMounts:
      - name: tmp
        mountPath: /tmp
      securityContext: *id001
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 300m
          memory: 256Mi
    container:
      image: mirror.gcr.io/library/python@sha256:4c47124a8391cb7a9f571164147d154777cf012a4ece5f86097130d7a4478111
      command:
      - /bin/sh
      - -c
      env:
      - name: PYTHONDONTWRITEBYTECODE
        value: '1'
      - name: HOME
        value: /tmp
      args:
      - "set -eu\ncat > /tmp/sbom_licenses.py <<'PYEOF'\nimport html, json, re, sys\nfrom collections\
        \ import Counter, defaultdict\n\nFAMS = [\n    (\"permissive\", \"Permissive\", \"#15803d\"),\n\
        \    (\"weak\", \"Weak copyleft (LGPL, MPL, EPL...)\", \"#ca8a04\"),\n    (\"strong\", \"Strong\
        \ copyleft (GPL)\", \"#c2410c\"),\n    (\"network\", \"Network copyleft (AGPL)\", \"#b91c1c\"\
        ),\n    (\"other\", \"Other / unclassified\", \"#7c3aed\"),\n    (\"unknown\", \"Unknown (NOASSERTION)\"\
        , \"#6b7280\"),\n    (\"none\", \"No license data\", \"#475569\"),\n]\nFAM_NAME = dict((k, n)\
        \ for k, n, _ in FAMS)\nFAM_COLOR = dict((k, c) for k, _, c in FAMS)\nRANK = {\"permissive\":\
        \ 0, \"other\": 1, \"weak\": 2, \"strong\": 3, \"network\": 4}\nPERMISSIVE = (\"MIT\", \"APACHE\"\
        , \"BSD\", \"ISC\", \"ZLIB\", \"0BSD\", \"X11\", \"X-11\", \"UNLICENSE\",\n              \"PUBLIC-DOMAIN\"\
        , \"PUBLIC DOMAIN\", \"PSF\", \"PYTHON\", \"BSL-1.0\", \"CC0\", \"WTFPL\",\n              \"ARTISTIC\"\
        , \"CURL\", \"OPENSSL\", \"LIBPNG\", \"HPND\", \"NCSA\", \"BLESSING\", \"UNICODE\",\n        \
        \      \"FTL\", \"JSON\", \"BOOST\", \"ZPL\", \"W3C\", \"UPL\", \"BZIP2\", \"LIBTIFF\", \"MS-PL\"\
        , \"AFL\",\n              \"OFL\", \"NTP\", \"IJG\", \"TCL\", \"SGI-B\", \"APSL-\", \"ICU\", \"\
        BEERWARE\", \"POSTGRESQL\",\n              \"SSH-\", \"CC-PDDC\", \"BZIP\", \"NAIST\", \"SAX-PD\"\
        , \"FSF\", \"LPD-\", \"MULANPSL\", \"BLUEOAK\")\nWEAK = (\"MPL\", \"EPL\", \"CDDL\", \"CPL\",\
        \ \"EUPL\", \"CECILL\", \"OSL\", \"LGPL\", \"CC-BY-SA\", \"MS-RL\")\n\n\ndef token_family(tok):\n\
        \    t = re.sub(r\"\\s+WITH\\s+.*$\", \"\", tok.strip(), flags=re.I).strip()\n    u = t.upper()\n\
        \    if not t or u in (\"NOASSERTION\", \"NONE\"):\n        return None\n    if \"AGPL\" in u\
        \ or \"AFFERO\" in u:\n        return \"network\"\n    if \"LGPL\" in u or \"LESSER GENERAL\"\
        \ in u or \"LIBRARY GENERAL\" in u:\n        return \"weak\"\n    if \"GPL\" in u or \"GENERAL\
        \ PUBLIC LICEN\" in u:\n        return \"strong\"\n    if u.startswith(WEAK):\n        return\
        \ \"weak\"\n    if u.startswith(PERMISSIVE) or re.search(r\"\\b(mit|apache|bsd)\\b\", t, re.I):\n\
        \        return \"permissive\"\n    return \"other\"\n\n\ndef expr_family(expr):\n    # SPDX-style\
        \ expressions: AND = all apply (strictest wins), OR = licensee\n    # picks the least restrictive.\
        \ Plain names/ids skip the parser entirely.\n    if not re.search(r\"\\s(AND|OR)\\s|[()]\", expr,\
        \ re.I):\n        return token_family(expr)\n    toks = [t.strip() for t in re.split(r\"(\\(|\\\
        )|\\s+AND\\s+|\\s+OR\\s+)\", expr, flags=re.I) if t and t.strip()]\n    pos = [0]\n\n    def peek():\n\
        \        return toks[pos[0]].upper() if pos[0] < len(toks) else \"\"\n\n    def pick(fams, fn):\n\
        \        known = [f for f in fams if f]\n        return fn(known, key=RANK.get) if known else\
        \ None\n\n    def p_or():\n        v = [p_and()]\n        while peek() == \"OR\":\n          \
        \  pos[0] += 1\n            v.append(p_and())\n        return pick(v, min)\n\n    def p_and():\n\
        \        v = [p_atom()]\n        while peek() == \"AND\":\n            pos[0] += 1\n         \
        \   v.append(p_atom())\n        return pick(v, max)\n\n    def p_atom():\n        t = toks[pos[0]]\
        \ if pos[0] < len(toks) else \"\"\n        pos[0] += 1\n        if t == \"(\":\n            v\
        \ = p_or()\n            if peek() == \")\":\n                pos[0] += 1\n            return v\n\
        \        return token_family(t)\n\n    return p_or()\n\n\ndef component_license(comp):\n    entries\
        \ = []\n    for lic in comp.get(\"licenses\") or []:\n        if \"expression\" in lic:\n    \
        \        entries.append(lic[\"expression\"])\n        elif \"license\" in lic:\n            entries.append(lic[\"\
        license\"].get(\"id\") or lic[\"license\"].get(\"name\") or \"\")\n    entries = [e.strip() for\
        \ e in entries if e and e.strip()]\n    if not entries:\n        return \"none\", \"\", [], None\n\
        \    known = [f for f in (expr_family(e) for e in entries) if f]\n    label = \" + \".join(entries)\n\
        \    if not known:\n        return \"unknown\", label, entries, None\n    return max(known, key=RANK.get),\
        \ label, entries, min(known, key=RANK.get)\n\n\ndef iter_items(path):\n    # Streams the \"items\"\
        \ array of a (possibly ~100MB) Kubernetes List JSON one\n    # object at a time, so memory stays\
        \ at one report instead of the whole\n    # file. Works on any JSON formatting (compact or kubectl's\
        \ indented).\n    dec = json.JSONDecoder()\n    with open(path) as f:\n        st = {\"buf\":\
        \ \"\", \"eof\": False}\n\n        def more():\n            c = f.read(1 << 20)\n            if\
        \ not c:\n                st[\"eof\"] = True\n            st[\"buf\"] += c\n\n        m = None\n\
        \        while not m:\n            m = re.search(r'\"items\"\\s*:\\s*\\[', st[\"buf\"])\n    \
        \        if not m:\n                if st[\"eof\"]:\n                    return\n            \
        \    more()\n        st[\"buf\"] = st[\"buf\"][m.end():]\n        while True:\n            st[\"\
        buf\"] = st[\"buf\"].lstrip(\" \\t\\r\\n,\")\n            if not st[\"buf\"]:\n              \
        \  if st[\"eof\"]:\n                    return\n                more()\n                continue\n\
        \            if st[\"buf\"][0] == \"]\":\n                return\n            try:\n         \
        \       obj, end = dec.raw_decode(st[\"buf\"])\n            except json.JSONDecodeError:\n   \
        \             if st[\"eof\"]:\n                    raise\n                more()\n           \
        \     continue\n            yield obj\n            st[\"buf\"] = st[\"buf\"][end:]\n\n\ndef esc(x):\n\
        \    return html.escape(str(x if x is not None else \"\"))\n\n\ndef eco_of(comp):\n    m = re.match(r\"\
        pkg:([^/]+)/\", comp.get(\"purl\") or \"\")\n    return m.group(1) if m else (comp.get(\"type\"\
        ) or \"unknown\")\n\n\ndef collect(path):\n    pkgs = {}                              # (eco,\
        \ name, version) -> (family, label)\n    lic_pkgs = defaultdict(set)            # label -> unique\
        \ pkg keys\n    lic_occ = Counter()                    # label -> occurrences (per image)\n  \
        \  lic_fam = {}\n    eco_total, eco_lic = Counter(), Counter()\n    reports = []\n    n = 0\n\
        \    for it in iter_items(path):\n        n += 1\n        rep = it.get(\"report\", {})\n     \
        \   art = rep.get(\"artifact\", {})\n        counts, flagged, total = Counter(), [], 0\n     \
        \   for c in rep.get(\"components\", {}).get(\"components\", []) or []:\n            if c.get(\"\
        type\") == \"operating-system\":\n                continue\n            fam, label, entries, lenient\
        \ = component_license(c)\n            eco = eco_of(c)\n            key = (eco, c.get(\"name\"\
        , \"\"), c.get(\"version\", \"\"))\n            total += 1\n            counts[fam] += 1\n   \
        \         if key not in pkgs:\n                pkgs[key] = (fam, label)\n                eco_total[eco]\
        \ += 1\n                if fam != \"none\":\n                    eco_lic[eco] += 1\n         \
        \       for e in entries:\n                    lic_pkgs[e].add(key)\n            for e in entries:\n\
        \                lic_occ[e] += 1\n                lic_fam.setdefault(e, expr_family(e) or \"unknown\"\
        )\n            if fam in (\"weak\", \"strong\", \"network\"):\n                flagged.append((fam,\
        \ c.get(\"name\", \"\"), c.get(\"version\", \"\"), eco, label, lenient))\n        meta = it.get(\"\
        metadata\", {})\n        reports.append({\n            \"ns\": meta.get(\"namespace\", \"\"),\
        \ \"name\": meta.get(\"name\", \"\"),\n            \"image\": \"%s:%s\" % (art.get(\"repository\"\
        , \"\"), art.get(\"tag\", \"\")) if art.get(\"tag\") else art.get(\"repository\", \"\"),\n   \
        \         \"total\": total, \"counts\": counts, \"flagged\": flagged,\n        })\n    if n ==\
        \ 0:\n        sys.exit(\"no SbomReports in %s - refusing to write an empty report\" % path)\n\
        \    return pkgs, lic_pkgs, lic_occ, lic_fam, eco_total, eco_lic, reports\n\n\nCSS = (\n    \"\
        body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:24px;max-width:1400px}\"\
        \n    \"h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:28px 0 8px;color:#cbd5e1}\"\n\
        \    \".meta{color:#94a3b8;font-size:13px;margin-bottom:18px}.note{color:#94a3b8;font-size:12px;margin:6px\
        \ 0 14px}\"\n    \".cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}\"\n    \".card{background:#1e293b;border-radius:8px;padding:12px\
        \ 16px;min-width:150px}\"\n    \".card b{display:block;font-size:22px}.card span{color:#94a3b8;font-size:12px}\"\
        \n    \"table{border-collapse:collapse;width:100%;background:#1e293b;margin-bottom:12px}\"\n \
        \   \"th,td{padding:5px 10px;border-bottom:1px solid #334155;text-align:left;font-size:13px}\"\
        \n    \"th{background:#0b1220;color:#94a3b8;position:sticky;top:0}tr:hover{background:#273449}\"\
        \n    \".num{text-align:right;font-variant-numeric:tabular-nums}\"\n    \".badge{display:inline-block;padding:2px\
        \ 8px;border-radius:10px;font-size:11px;font-weight:600;color:#fff;margin-right:4px}\"\n    \"\
        .bar{display:flex;height:26px;border-radius:6px;overflow:hidden;margin:8px 0}.bar div{height:100%}\"\
        \n    \".legend span{margin-right:14px;font-size:12px;color:#cbd5e1}.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}\"\
        \n    \".scroll{max-height:420px;overflow:auto;border-radius:6px}\"\n    \"input{background:#1e293b;border:1px\
        \ solid #334155;color:#e2e8f0;padding:6px 10px;border-radius:6px;width:300px;margin-bottom:8px}\"\
        \n    \"details{background:#1e293b;border-radius:6px;margin-bottom:6px}summary{cursor:pointer;padding:8px\
        \ 14px;font-size:13px}\"\n    \"summary:hover{background:#273449}.row{padding:8px 14px;font-size:13px;background:#1e293b;border-radius:6px;margin-bottom:6px}\"\
        \n    \".inner{margin:0 14px 12px;width:calc(100% - 28px)}\"\n)\nJS = (\"function f(b,s){var q=b.value.toLowerCase();document.querySelectorAll(s).forEach(function(e)\"\
        \n      \"{e.style.display=e.textContent.toLowerCase().indexOf(q)<0?'none':'';});}\")\n\n\ndef\
        \ badge(fam, text):\n    return \"<span class='badge' style='background:%s'>%s</span>\" % (FAM_COLOR[fam],\
        \ esc(text))\n\n\ndef render(out_path, pkgs, lic_pkgs, lic_occ, lic_fam, eco_total, eco_lic, reports):\n\
        \    fam_u, fam_o = Counter(), Counter()\n    for fam, _ in pkgs.values():\n        fam_u[fam]\
        \ += 1\n    for r in reports:\n        for fam, n in r[\"counts\"].items():\n            fam_o[fam]\
        \ += n\n    total_u, total_o = len(pkgs), sum(fam_o.values())\n    with_lic = total_u - fam_u[\"\
        none\"]\n    copyleft = fam_u[\"weak\"] + fam_u[\"strong\"] + fam_u[\"network\"]\n    o = [\"\
        <!DOCTYPE html><html><head><meta charset='utf-8'><title>SBOM licenses</title><style>%s</style></head><body>\"\
        \ % CSS,\n         \"<h1>SBOM license report</h1>\",\n         \"<div class='meta'>%d images &middot;\
        \ %d component occurrences &middot; %d unique packages (ecosystem + name + version)</div>\"\n\
        \         % (len(reports), total_o, total_u),\n         \"<div class='cards'>\"\n         \"<div\
        \ class='card'><b>%d</b><span>unique packages</span></div>\"\n         \"<div class='card'><b>%.0f%%</b><span>carry\
        \ license data</span></div>\"\n         \"<div class='card'><b>%d</b><span>copyleft packages (LGPL/GPL/AGPL/MPL...)</span></div>\"\
        \n         \"<div class='card'><b>%d</b><span>strong + network copyleft</span></div></div>\"\n\
        \         % (total_u, 100.0 * with_lic / max(total_u, 1), copyleft, fam_u[\"strong\"] + fam_u[\"\
        network\"])]\n    o.append(\"<h2>License families (unique packages)</h2><div class='bar'>\")\n\
        \    for k, n, c in FAMS:\n        if fam_u[k]:\n            o.append(\"<div style='width:%.2f%%;background:%s'\
        \ title='%s: %d'></div>\" % (100.0 * fam_u[k] / max(total_u, 1), c, esc(n), fam_u[k]))\n    o.append(\"\
        </div><div class='legend'>\")\n    for k, n, c in FAMS:\n        o.append(\"<span><i class='dot'\
        \ style='background:%s'></i>%s %d</span>\" % (c, esc(n), fam_u[k]))\n    o.append(\"</div><table><thead><tr><th>Family</th><th\
        \ class='num'>Unique packages</th><th class='num'>%</th>\"\n             \"<th class='num'>Occurrences\
        \ (all images)</th></tr></thead><tbody>\")\n    for k, n, c in FAMS:\n        o.append(\"<tr><td>%s</td><td\
        \ class='num'>%d</td><td class='num'>%.1f</td><td class='num'>%d</td></tr>\"\n               \
        \  % (badge(k, n), fam_u[k], 100.0 * fam_u[k] / max(total_u, 1), fam_o[k]))\n    o.append(\"</tbody></table>\"\
        )\n    o.append(\"<h2>Why so much &ldquo;No license data&rdquo;? Coverage by ecosystem</h2>\"\n\
        \             \"<div class='note'>License info only exists where the package manager records it.\
        \ Go binaries embed none, \"\n             \"so Go modules always land in &ldquo;No license data&rdquo;.</div>\"\
        \n             \"<table><thead><tr><th>Ecosystem</th><th class='num'>Unique packages</th><th class='num'>With\
        \ license</th>\"\n             \"<th class='num'>Coverage</th></tr></thead><tbody>\")\n    for\
        \ eco, n in eco_total.most_common():\n        o.append(\"<tr><td>%s</td><td class='num'>%d</td><td\
        \ class='num'>%d</td><td class='num'>%.0f%%</td></tr>\"\n                 % (esc(eco), n, eco_lic[eco],\
        \ 100.0 * eco_lic[eco] / n))\n    o.append(\"</tbody></table><h2>Licenses</h2>\"\n           \
        \  \"<div class='note'>Each individual license entry is counted; a package listing several licenses\
